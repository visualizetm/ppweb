    <!-- Barlow Condensed for display, Archivo for body, Spline Sans Mono for
         data readouts (dates, references, money). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Pre-paint theme script. Must stay inline and must stay above the app mount,
      or the first frame paints in the wrong theme.

      DARK IS THE DEFAULT. Automotive work is night- and golden-hour heavy, so
      the interface stays out of the photographs' way.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pp_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
