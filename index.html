  <head>
    <meta charset="UTF-8" />

    <title>Paps Productions — Cinematic Automotive Photography</title>

      name="description"

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Archivo is loaded as a VARIABLE font across the width axis (75..125).
      Display type runs expanded at wdth 118 so headings read as a stamped
      nameplate. Requesting the axis rather than a static weight is what makes
      that possible in one file.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Public+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Pre-paint theme script. Must stay inline and must stay above the app mount,
      or the first frame paints in the wrong theme.

      LIGHT IS THE DEFAULT. The grey card under working light is the primary
      theme; dark is the same card in shade. This is a deliberate reversal of
      the previous build, which was dark-first.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pp_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
